<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba PayPal | ZuzuBayo</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#fffaf5;
      color:#201b1c;
      display:flex;
      justify-content:center;
      padding:50px 20px;
    }

    .box{
      width:min(460px,100%);
      background:white;
      border:1px solid #efd9dd;
      border-radius:22px;
      padding:32px;
      text-align:center;
    }

    h1{
      color:#7f1020;
    }

    .price{
      font-size:28px;
      font-weight:bold;
      color:#a81429;
      margin:20px 0;
    }

    #message{
      margin-top:20px;
      font-size:14px;
    }

    paypal-button{
      width:100%;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Prueba ZuzuBayo ♡</h1>

    <p>
      Compra de prueba usando PayPal Sandbox.
    </p>

    <div class="price">
      $1.00 USD
    </div>

    <paypal-button
      id="paypal-button"
      type="pay">
    </paypal-button>

    <div id="message"></div>

  </div>


  <script
    src="https://www.paypal.com/web-sdk/v6/core"
    onload="onPayPalWebSdkLoaded()">
  </script>


  <script>

    const API_BASE =
      "https://zuzubayo-payments.zuzu-bayo-c.workers.dev";


    async function createOrder(){

      const response = await fetch(
        `${API_BASE}/create-order`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            amount:"1.00",
            description:"Prueba ZuzuBayo"
          })
        }
      );


      const data = await response.json();


      if(!response.ok || !data.orderID){
        throw new Error(
          data.message || "No se pudo crear la orden."
        );
      }


      return {
        orderId:data.orderID
      };
    }



    async function captureOrder(orderId){

      const response = await fetch(
        `${API_BASE}/capture-order`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            orderID:orderId
          })
        }
      );


      const data = await response.json();


      if(!response.ok || !data.ok){
        throw new Error(
          data.message ||
          "No se pudo completar el pago."
        );
      }


      return data;
    }



    async function onPayPalWebSdkLoaded(){

      const message =
        document.getElementById("message");


      try{

        const sdkInstance =
          await window.paypal.createInstance({

            clientId:
              "AR7hk80Dl4KirsPdTjgJ4MQQXBHluArZZOaSQEbdCvQkBmPphxL4tF22WPpzZYS52EN13MgYj5vLFRvr",

            components:[
              "paypal-payments"
            ],

            pageType:"checkout"
          });


        const paypalSession =
          sdkInstance.createPayPalOneTimePaymentSession({

            onApprove:async(data)=>{

              message.textContent =
                "Confirmando tu pago... ♡";


              const result =
                await captureOrder(
                  data.orderId
                );


              message.innerHTML =
                "✅ Pago completado.<br>" +
                "Order ID: " +
                result.orderID;

            },


            onCancel:()=>{

              message.textContent =
                "Pago cancelado.";

            },


            onError:(error)=>{

              console.error(error);

              message.textContent =
                "Ocurrió un error con PayPal.";

            }

          });



        const button =
          document.getElementById(
            "paypal-button"
          );


        button.addEventListener(
          "click",
          async()=>{

            message.textContent =
              "Abriendo PayPal...";


            await paypalSession.start(
              {
                presentationMode:"auto",
                targetElement:button
              },
              createOrder()
            );

          }
        );


        if(paypalSession.hasReturned()){
          await paypalSession.resume();
        }

      }
      catch(error){

        console.error(error);

        message.textContent =
          "No se pudo iniciar PayPal.";

      }

    }

  </script>

</body>
</html>
