<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  >

  <title>Categoría de Stickers | ZuzuBayo</title>

  <link
    rel="stylesheet"
    href="stickers-category.css"
  >
</head>

<body>
  <div class="topbar">
    <span>⇩ Stickers digitales</span>
    <span>♡ Colecciones ZuzuBayo</span>
    <span>Digital Goodies</span>
  </div>

  <header>
    <div class="nav">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="ZuzuBayo">
      </a>

      <a href="stickers.html" class="back-button">
        ← Volver a stickers
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="breadcrumb">
        <a href="index.html">Inicio</a>
        &nbsp;/&nbsp;
        <a href="stickers.html">Stickers</a>
        &nbsp;/&nbsp;
        <span id="breadcrumb-category">Categoría</span>
      </div>

      <h1 id="category-title">Stickers</h1>

      <p id="category-description">
        Explora nuestras colecciones de stickers digitales.
      </p>
    </section>

    <section id="category-content"></section>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="logo.png" alt="ZuzuBayo">
      </div>

      <div class="footer-links">
        <a href="index.html">Inicio</a>
        <a href="stickers.html">Stickers</a>
        <a href="index.html#faq">Preguntas frecuentes</a>
        <a href="index.html#contacto">Contacto</a>
      </div>
    </div>

    <div class="copyright">
      © 2026 ZuzuBayo · Todos los derechos reservados
    </div>
  </footer>

  <script>
    const categories = {
      "cute-aesthetic": {
        title: "Cute & Aesthetic",
        description:
          "Stickers delicados, femeninos y decorativos para darle un toque bonito a tus proyectos.",
        products: [
          {
            name: "Cute & Aesthetic Pack 01",
            description:
              "Una colección femenina y delicada para notas, journals, planners y proyectos digitales.",
            label: "32 STICKERS PNG ♡",
            image: "cute-aesthetic-pack-01-preview.png",
            link: "producto-cute-aesthetic-pack-01.html"
          }
        ]
      },

      "self-care": {
        title: "Self-Care",
        description:
          "Stickers de bienestar, rutinas, hábitos y motivación.",
        products: []
      },

      "productivity": {
        title: "Productivity",
        description:
          "Stickers para organizar tareas, metas, estudios y proyectos.",
        products: []
      },

      "celebraciones-temporadas": {
        title: "Celebraciones & Temporadas",
        description:
          "Stickers para cumpleaños, festividades y fechas especiales.",
        products: []
      },

      "packs-zuzubayo": {
        title: "Packs ZuzuBayo",
        description:
          "Colecciones especiales creadas con el estilo de ZuzuBayo.",
        products: []
      }
    };

    const parameters = new URLSearchParams(window.location.search);
    const categoryKey = parameters.get("categoria");

    const category =
      categories[categoryKey] || {
        title: "Nuevos stickers",
        description:
          "Estamos preparando nuevas colecciones para ZuzuBayo.",
        products: []
      };

    const title = document.getElementById("category-title");
    const description =
      document.getElementById("category-description");
    const breadcrumb =
      document.getElementById("breadcrumb-category");
    const content =
      document.getElementById("category-content");

    title.textContent = category.title;
    description.textContent = category.description;
    breadcrumb.textContent = category.title;

    document.title =
      category.title + " Stickers | ZuzuBayo";

    if (category.products.length > 0) {
      content.className = "products";

      category.products.forEach(function(product) {
        const productCard = document.createElement("a");

        productCard.href = product.link;
        productCard.className = "product-card";

        productCard.innerHTML = `
          <div class="product-image">
            <img
              src="${product.image}"
              alt="${product.name}"
            >
          </div>

          <div class="product-copy">
            <span class="label">
              ${product.label}
            </span>

            <h2>${product.name}</h2>

            <p>${product.description}</p>

            <span class="product-link">
              Ver producto →
            </span>
          </div>
        `;

        content.appendChild(productCard);
      });
    } else {
      content.className = "coming-state";

      content.innerHTML = `
        <div class="coming-symbol">♡</div>

        <h2>Estamos trabajando en nuevos productos</h2>

        <p>
          Esta colección todavía no tiene productos disponibles.
          Regresa pronto para descubrir las novedades de ZuzuBayo.
        </p>

        <a href="stickers.html">
          Ver otras categorías
        </a>
      `;
    }
  </script>
</body>
</html>
